<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarifa Turismo - Panel Control</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
<header class="cabecera">
    <h1>Turismo Tarifa 🏖️</h1>
</header>

<main class="contenedor-principal">
    <section class="caja-estadisticas">
        <p><strong>Capacidad Total:</strong> <span class="dato-aforo">Cargando...</span> personas</p>
    </section>

    <section class="seccion-busqueda">
        <h3>Buscar por ID</h3>
        <input type="number" class="input-busqueda" placeholder="ID del sitio">
        <button onclick="buscarUno()" class="boton-azul">Buscar</button>
        <button onclick="cargarTodos()" class="boton-gris">Ver todos</button>
    </section>

    <section class="seccion-lista">
        <h3>Lugares Registrados</h3>
        <div class="lista-sitios">
        </div>
    </section>

    <section class="seccion-formulario">
        <h3>Añadir Nuevo Rincón</h3>
        <form class="formulario-nuevo">
            <input type="text" class="f-nombre" placeholder="Nombre" required>
            <select class="f-tipo">
                <option value="Playa">Playa</option>
                <option value="Punto de interes">Punto de interés</option>
                <option value="Restaurante">Restaurante</option>
            </select>
            <select class="f-dificultad">
                <option value="Baja">Baja</option>
                <option value="Media">Media</option>
                <option value="Alta">Alta</option>
            </select>
            <input type="number" step="0.1" class="f-puntuacion" placeholder="Puntuación (1-10)" required>
            <input type="number" class="f-aforo" placeholder="Aforo Máximo">
            <button type="submit" class="boton-verde">Guardar en API</button>
        </form>
    </section>
</main>

<script src="frontend.js"></script>
</body>
</html>
